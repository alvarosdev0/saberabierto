# openspec/config.yaml
schema: spec-driven

context: |
  Project: saberabierto — PWA de estudio con metodología Dot Dager
  Stack: React 19 + Vite 6 + Tailwind CSS v4 + Dexie.js 4 + React Router 7 (HashRouter) + PWA (vite-plugin-pwa, Workbox)
  Architecture: SPA, mobile-first, offline-first, lazy-loaded pages via React.lazy + Suspense, React Context for state, pdfjs-dist lazy-imported, AI providers abstracted behind shared interface
  Testing: No test runner detected — strict_tdd disabled
  Style: Spanish UI, English technical artifacts (SDD specs/designs/tasks default to English)
  Persistence: hybrid (openspec files + Engram observations)

rules:
  proposal:
    - Include scope boundaries (in/out of scope) and capability deltas
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with tradeoffs in table format
    - Include project structure and data flow
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include chained-PR strategy for large changes
  apply:
    - Follow existing React patterns and project structure
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Sync delta specs with current implementation state

testing:
  strict_tdd: false
  detected: 2026-07-09
  runner: none
  reason: "No test runner configured in package.json or project config."
  layers:
    unit: { available: false, tool: "--" }
    integration: { available: false, tool: "--" }
    e2e: { available: false, tool: "--" }
  coverage: { available: false, command: "--" }
  quality:
    linter: { available: false, command: "--" }
    type_checker: { available: false, command: "--" }
    formatter: { available: false, command: "--" }
